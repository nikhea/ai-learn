  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest # swap to -gpu if you have an NVIDIA card
    container_name: kokoro-tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai-stack

  whisper-stt:
    image: hwdsl2/whisper-server:latest
    container_name: whisper-stt
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - WHISPER_API_KEY=
    volumes:
      - whisper-data:/var/lib/whisper
    networks:
      - ai-stack
